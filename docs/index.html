<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typo Tyrant</title>
<meta name="description" content="Typo Tyrant: a typing game where you spell to survive. Every round gets faster, and a boss waits at the end of each one.">
<style>
  :root { --bg: #1A0F24; --surface: #26162F; --ink: #FCEBF2; --muted: #B193A8; --gold: #FFC94D; --line: #3A2545; }
  @media (prefers-color-scheme: light) { :root { --bg: #FBF7FC; --surface: #FFFFFF; --ink: #24142E; --muted: #5E4A68; --gold: #9A6A00; --line: #E6DCEA; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 64px 20px; text-align: center; }
  h1 { font-family: Georgia, "Times New Roman", serif; color: var(--gold); font-size: 2.6rem; margin: 0; letter-spacing: 0.02em; }
  .tag { color: var(--muted); letter-spacing: 0.3em; font-size: 0.8rem; margin: 4px 0 24px; }
  p { max-width: 520px; margin: 0 auto 16px; }
  nav { margin-top: 32px; display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
  a { color: var(--gold); }
</style>
</head>
<body>
<main>
  <h1>Typo Tyrant</h1>
  <div class="tag">SPELL TO SURVIVE</div>
  <p>Type each word before the clock runs out. Every round gets faster, and a boss waits at the end of each one.
  Climb 100 floors and dethrone the Typo Tyrant.</p>
  <p>Coming soon to iPhone and iPad.</p>
  <nav>
    <a href="support.html">Support</a>
    <a href="privacy-policy.html">Privacy policy</a>
  </nav>
</main>
</body>
</html>
